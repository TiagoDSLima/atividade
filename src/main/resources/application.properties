spring.application.name=atividade1-moderno
server.port=${SERVER_PORT:8080}

# Banco de dados (valores padrão para execução local; no Docker vêm do docker-compose.yml)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tarefas}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate
hibernate.hbm2ddl.auto=${HIBERNATE_DDL_AUTO:update}
hibernate.show_sql=${HIBERNATE_SHOW_SQL:false}
